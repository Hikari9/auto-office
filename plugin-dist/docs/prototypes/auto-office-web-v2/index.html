let state={opt:2,view:'issues',repo:'All repositories',agent:null,auto:true};
function icon(s){return s==='All repositories'?'✦':s.includes('security')?'S':s.includes('connect')?'C':s.includes('bible')?'B':s.includes('rsvp')?'R':s.includes('pages')?'P':'A'}
function repoSidebar(compact=false){return `<div class="sidebar-inner"><div class="section-kicker">Repository</div><input class="repo-search" placeholder="Filter repositories…" value=""><div class="repo-list">${repos.map(r=>`<button class="repo ${r.name===state.repo?'active':''} ${r.all?'all-repos':''}" data-repo="${r.name}"><span class="repo-icon">${icon(r.name)}</span><span>${r.name}</span><span class="repo-meta">${r.count}</span></button>`).join('')}</div><div class="section-kicker" style="margin-top:18px">Machine</div><div class="context-card"><div class="context-line"><span>Scheduler</span><b style="color:#76ddb3">AUTO</b></div><div class="context-line"><span>CPU pressure</span><b>62%</b></div><div class="context-line"><span>RAM</span><b>18.4 / 32 GB</b></div><div class="context-line"><span>Runnable</span><b>6</b></div></div></div>`}
function navRail(){return `<div class="navrail">${[['issues','▤','Issues'],['agents','⌘','Agents'],['allocation','⇄','Allocate'],['settings','⚙','Settings']].map(([v,i,l])=>`<button class="navbtn ${state.view===v?'active':''}" data-view="${v}"><span class="navico">${i}</span>${l}</button>`).join('')}<div style="flex:1"></div><button class="navbtn"><span class="navico">?</span>Help</button></div>`}
function contextRail(){return `<aside class="context-rail"><div class="section-kicker">Now</div><div class="context-card accent-top"><h4>Machine scheduler</h4><div class="context-line"><span>Mode</span><b>Auto</b></div><div class="context-line"><span>Recommended</span><b>6 active</b></div><div class="context-line"><span>Running</span><b>5</b></div><div class="context-line"><span>Queued</span><b>8</b></div></div><div class="context-card"><h4>Provider headroom</h4><div class="context-line"><span>Claude</span><b>58%</b></div><div class="context-line"><span>Codex</span><b>73%</b></div><div class="context-line"><span>AGY</span><b style="color:#f2bd61">11%</b></div></div><div class="context-card"><h4>Current topology</h4><div class="mini-graph"><i class="mini-dot orange" style="left:24px;top:49px"></i><i class="mini-dot green" style="left:94px;top:23px"></i><i class="mini-dot green" style="left:94px;top:74px"></i><i class="mini-dot" style="left:165px;top:74px"></i><i class="mini-line" style="left:36px;top:55px;width:61px;transform:rotate(-21deg)"></i><i class="mini-line" style="left:36px;top:55px;width:61px;transform:rotate(21deg)"></i><i class="mini-line" style="left:106px;top:80px;width:62px"></i></div></div><div class="context-card"><h4>Recent routing</h4><div style="font-size:9px;color:#c7cfdb;line-height:1.45">T25 rerouted <b>AGY → Claude</b><br><span style="color:#79869a">quota fallback · policy allowed</span></div></div></aside>`}
function filteredIssues(){return issues.filter(i=>state.repo==='All repositories'||i.repo===state.repo)}
function issuesView(){let rows=filteredIssues(); return `<div class="page"><div class="page-head"><div><div class="page-title">Issues</div><div class="page-sub">GitHub intake + Auto Office run state. Issue-first, machine-aware.</div></div><div class="head-actions"><button class="btn ghost">Sync GitHub</button><button class="btn primary">+ Queue prompt</button></div></div><div class="notice">⚡ <span><b>Auto mode is active.</b> Allowed fallbacks reroute automatically. Latest: AGY → Claude for T25 because AGY crossed its quota reserve.</span><button class="btn sm" style="margin-left:auto">View event</button></div><div class="metric-strip"><div class="metric accent-top"><div class="v">${rows.filter(x=>x.run).length}</div><div class="k">Office runs</div><div class="detail">${rows.filter(x=>x.state==='running'||x.state==='review').length} active now</div></div><div class="metric"><div class="v">${rows.filter(x=>!x.run).length}</div><div class="k">Incoming issues</div><div class="detail">${rows.filter(x=>x.queued).length} authorized for queue</div></div><div class="metric"><div class="v">5</div><div class="k">Running agents</div><div class="detail">across 3 runs</div></div><div class="metric"><div class="v">62%</div><div class="k">CPU pressure</div><div class="detail">recommended concurrency: 6</div></div><div class="metric"><div class="v">8</div><div class="k">Queue depth</div><div class="detail">weighted by dependency + priority</div></div></div><div class="filters"><input class="search-main" placeholder="Search issues, run IDs, tasks…"><button class="pill active">Open + running</button><button class="pill">Incoming</button><button class="pill">Needs attention</button><button class="pill">Done</button></div><div class="table-card"><table><thead><tr><th>Issue</th><th>Phase</th><th>Run owner</th><th>Weighted progress</th><th>Priority</th><th>Authorization</th><th>Auto queue</th><th>Run / command</th></tr></thead><tbody>${rows.map((i,idx)=>`<tr data-issue="${i.n}" class="${idx===0?'selected':''}"><td><div class="issue-title"><span class="issue-num">#${i.n}</span>${i.title}</div><div style="font-size:9px;color:#6f7b8d;margin-top:2px">${i.repo}</div></td><td><span class="phase"><i class="statusdot ${i.state}"></i>${i.phase}</span><div style="font-size:8px;color:#6f7c8f;margin-top:3px">${i.note}</div></td><td>${i.owner}</td><td class="progresscell">${i.total?`<div class="bar"><i style="width:${i.weighted}%"></i></div><div class="progressnote">${i.weighted}% weighted · ${i.done}/${i.total} tasks accepted</div>`:`<span style="color:#6f7b8d">Not planned</span>`}</td><td><span class="priority p-${i.priority.toLowerCase()}">${i.priority}</span></td><td><select class="auth" data-auth="${i.n}"><option ${i.auth==='Preview only'?'selected':''}>Preview only</option><option ${i.auth==='PR / no merge'?'selected':''}>PR / no merge</option><option ${i.auth==='Merge to main'?'selected':''}>Merge to main</option><option>Production</option></select></td><td><input class="queuecheck" type="checkbox" ${i.queued?'checked':''} data-queue="${i.n}"></td><td>${i.run?`<button class="btn sm" data-openrun="${i.run}">${i.run.slice(0,8)} ↗</button>`:`<div class="copycmd"><span class="mono cmd">${i.cmd}</span><button class="copy" data-copy="${i.cmd.replace(/"/g,'&quot;')}">Copy</button></div>`}</td></tr>`).join('')}</tbody></table></div></div>`}
function agentColumns(){const roles=['Orchestrator','Plan Reviewer','Executor','Code Reviewer','Visual Verifier']; return roles.map(role=>`<div class="role-col"><div class="role-title">${role}s</div>${agents.filter(a=>a.role===role&&(state.repo==='All repositories'||a.repo===state.repo)).map(a=>`<div class="node ${a.class} ${state.agent===a.id?'selected':''}" data-agent="${a.id}"><div class="node-head"><span class="statusdot ${a.state==='Running'?'running':a.state==='Paused'?'paused':a.state==='Done'?'ready':'idle'}"></span><span class="node-name">${a.id}</span><span class="node-state">${a.state}</span></div><div class="node-meta"><span class="tiny">${a.harness}</span><span class="tiny">${a.model}</span><span class="tiny">${a.effort}</span></div><div class="node-work">${a.work}</div><div class="resource"><span>CPU ${a.cpu}%</span><span>RAM ${a.ram} GB</span><span>CTX ${a.context}%</span></div></div>`).join('')}</div>`).join('')}
function agentInspector(a){if(!a)return ''; return `<div class="inspector open"><div class="ins-title">${a.role} · ${a.id}</div><div class="ins-sub">${a.repo} · run ${a.run} · Herdr ${a.pane}</div><div class="kv"><span>Status</span><b>${a.state}</b></div><div class="kv"><span>Harness</span><b>${a.harness}</b></div><div class="kv"><span>Model</span><b>${a.model}</b></div><div class="kv"><span>Effort</span><b>${a.effort}</b></div><div class="kv"><span>CPU</span><b>${a.cpu}%</b></div><div class="kv"><span>RAM</span><b>${a.ram} GB</b></div><div class="kv"><span>Context window</span><b>${a.context}%</b></div><div class="selectrow"><select><option>${a.model}</option><option>Opus 5.5</option><option>Sonnet</option><option>GPT-5.6</option><option>Gemini</option></select><select><option>${a.effort}</option><option>Low</option><option>Medium</option><option>High</option></select></div><button class="btn sm" style="width:100%;margin-top:7px" data-restart="${a.id}">Restart current work with selection</button>${a.role==='Orchestrator'?`<div class="chat"><div style="font-size:9px;font-weight:750;margin-bottom:6px">Message orchestrator</div><textarea placeholder="Send to bound orchestrator pane…"></textarea><button class="btn primary sm" style="margin-top:6px">Send via Herdr</button></div>`:`<div class="read-only">Worker chat is read-only here. Use structured routing/resource controls, or open the Herdr pane.</div>`}<button class="btn danger sm" style="margin-top:8px;width:100%" data-pause="${a.id}">Pause → move to end of queue</button></div>`}
function agentsView(){const a=agents.find(x=>x.id===state.agent);return `<div class="page"><div class="page-head"><div><div class="page-title">Agent Workstation</div><div class="page-sub">Machine-wide topology grouped by Auto Office roles. Current topology first; history stays attached to each run.</div></div><div class="head-actions"><button class="btn active">Running + paused</button><button class="btn">Include done</button><button class="btn">Fit graph</button></div></div><div class="filters"><button class="pill active">All runs</button><button class="pill">Critical path</button><button class="pill">Waiting</button><button class="pill">Done</button><span style="margin-left:auto;font-size:9px;color:#6f7c8f">Click a node for model, effort, resource and Herdr controls</span></div><div class="graph-wrap"><div class="graph-toolbar"><span class="graph-badge">${state.repo}</span><span class="graph-badge">5 running · 1 paused · 3 done/waiting</span><span class="graph-badge">Herdr linked</span><span class="graph-badge">Historical dispatches hidden</span></div><div class="edge-layer"><svg viewBox="0 0 1000 560" preserveAspectRatio="none"><path class="edge hot" d="M155,85 C230,85 230,210 400,210"/><path class="edge done" d="M155,85 C220,85 220,70 300,70"/><path class="edge hot" d="M155,85 C260,85 260,315 400,315"/><path class="edge" d="M500,210 C590,210 590,200 700,200"/><path class="edge done" d="M760,200 C825,200 825,210 910,210"/><path class="edge hot" d="M155,385 C280,385 280,435 400,435"/><path class="edge hot" d="M500,435 C590,435 590,400 700,400"/></svg></div><div class="graph-columns">${agentColumns()}</div>${agentInspector(a)}</div></div>`}
function allocationView(){const queue=[['orch-7d63','Orchestrator','rock-security','Running','High','4%'],['ex-t23','Executor','rock-security','Running','High','39%'],['cr-t10','Code Reviewer','connect','Running','High','26%'],['ex-t9','Executor','connect','Running','High','48%'],['ex-t25','Executor','rock-security','Running','Normal','33%'],['orch-5a19','Orchestrator','rock-security','Paused→tail','Normal','0%'],['issue-311','New run','auto-office','Queued','Normal','—'],['issue-735','New run','rock-pages','Waiting','Normal','—']]; return `<div class="page"><div class="page-head"><div><div class="page-title">Allocation</div><div class="page-sub">Preemptive machine scheduler: resource-aware admission, dependency boosts, aging, provider fallbacks and parallel distribution.</div></div><div class="head-actions"><button class="btn">Scheduler log</button><button class="btn primary">Add queued prompt</button></div></div><div class="alloc-grid"><section class="scheduler-card"><div class="scheduler-head"><div id="autoswitch" class="switch ${state.auto?'on':''}"></div><div><div style="font-size:12px;font-weight:760">Auto allocation ${state.auto?'ON':'OFF'}</div><div class="scheduler-rec">Recommended load: <b>6 active agents</b> · target responsiveness 35% reserve</div></div><div style="margin-left:auto"><button class="btn sm">Advanced ▾</button></div></div><div class="metric-strip" style="grid-template-columns:repeat(4,1fr)"><div class="metric"><div class="v">62%</div><div class="k">CPU pressure</div></div><div class="metric"><div class="v">57%</div><div class="k">RAM pressure</div></div><div class="metric"><div class="v">5 / 6</div><div class="k">Active / recommended</div></div><div class="metric"><div class="v">8</div><div class="k">Ready queue</div></div></div><div style="font-size:9px;color:#6e7a8e;margin:8px 0">Ready queue · scheduler order (manual Pause demotes; critical dependencies can receive temporary boosts)</div>${queue.map((q,i)=>`<div class="queue-row"><span class="qnum">${String(i+1).padStart(2,'0')}</span><span class="qtitle">${q[0]} <span class="qmuted">· ${q[1]}</span></span><span>${q[2]}</span><span class="tag">${q[3]}</span><span class="priority ${q[4]==='High'?'p-high':'p-normal'}">${q[4]}</span><span>${q[5]}</span><button class="btn sm">${q[3].startsWith('Paused')?'Resume':'Pause'}</button></div>`).join('')}<div class="scheduler-why"><b>Scheduler rationale:</b> keep orchestrators responsive, prefer agents that unblock dependent work, admit parallel work while CPU/RAM remain below reserve, age waiting items so they cannot starve, and reroute an eligible dispatch before delaying it when a provider quota is constrained.</div></section><aside class="quota-card"><div class="setting-title">Provider capacity</div><div class="setting-help">Quota is a scheduling resource, separate from local CPU/RAM.</div><div class="provider-grid"><div class="provider"><div class="provider-head">Claude <span style="margin-left:auto;color:#79daaF">healthy</span></div><div class="bar"><i style="width:58%"></i></div><div class="quota-note">58% headroom · fallback eligible</div></div><div class="provider"><div class="provider-head">Codex <span style="margin-left:auto;color:#79daaF">healthy</span></div><div class="bar"><i style="width:73%"></i></div><div class="quota-note">73% headroom</div></div><div class="provider"><div class="provider-head">AGY <span style="margin-left:auto;color:#f1bb5a">reserve</span></div><div class="bar"><i style="width:11%"></i></div><div class="quota-note">11% headroom · new eligible work reroutes</div></div></div><div class="notice" style="margin-top:10px;margin-bottom:0">↪ T25 fallback: AGY → Claude</div></aside></div></div>`}
function settingsView(){return `<div class="page"><div class="page-head"><div><div class="page-title">Settings</div><div class="page-sub">Cascading configuration with effective-value provenance: Machine → Repository → Run.</div></div><div class="head-actions"><button class="btn">Reset overrides</button><button class="btn primary">Save changes</button></div></div><div class="settings-layout"><nav class="settings-nav"><button class="active">Scheduler</button><button>Auto Routing</button><button>Auto Intake</button><button>Authorizations</button><button>Providers & quotas</button><button>Herdr</button><button>Repositories</button><button>UI & notifications</button></nav><main><div class="setting-card accent-top"><div class="setting-title">Scheduler <span class="scope">Machine</span></div><div class="setting-help">The planner classifies work; routing and scheduler policy turn those classifications into runnable dispatches.</div><div class="setting-row"><b>Auto allocation</b><span class="effective">Machine default</span><span>On</span></div><div class="setting-row"><b>Target reserve</b><span class="effective">Machine default</span><span>35% CPU</span></div><div class="setting-row"><b>Pause behavior</b><span class="effective">Machine default</span><span>Demote to tail</span></div><div class="setting-row"><b>Resume after terminal pause</b><span class="effective">Machine default</span><span>Manual</span></div></div><div class="setting-card"><div class="setting-title">Auto Routing <span class="scope">Effective for rock-security</span></div><div class="setting-help">Routes are chosen from planner classification, current capacity and permitted fallbacks. Existing running harness stays fixed; model + effort can restart current work.</div><div class="setting-row"><b>Executor · standard</b><span class="route-chain"><span class="route">AGY</span><span class="arrow">→</span><span class="route">Claude</span><span class="arrow">→</span><span class="route">Codex</span></span><span class="effective">Repo override</span></div><div class="setting-row"><b>Code review · high risk</b><span class="route-chain"><span class="route">Codex</span><span class="arrow">→</span><span class="route">Claude</span></span><span class="effective">Machine</span></div><div class="setting-row"><b>Visual verification</b><span class="route-chain"><span class="route">AGY</span><span class="arrow">→</span><span class="route">Claude</span></span><span class="effective">Machine</span></div></div><div class="setting-card"><div class="setting-title">Auto Intake authorization <span class="scope">Repository</span></div><div class="setting-help">New queued issues inherit the repository default, with Preview only as the machine fallback. The Issues table can override per issue.</div><div class="setting-row"><b>Default authorization</b><span class="effective">rock-security</span><span>PR / no merge</span></div><div class="setting-row"><b>Unconfigured repository fallback</b><span class="effective">Machine</span><span>Preview only</span></div></div><div class="setting-card"><div class="setting-title">Command surface <span class="scope">Machine</span></div><div class="setting-help">Keep routine controls allowlisted in the UI. Advanced terminal access opens in the existing Herdr workflow rather than embedding an unrestricted browser shell by default.</div><div class="setting-row"><b>Auto Office commands</b><span class="effective">Machine</span><span>Enabled</span></div><div class="setting-row"><b>Full shell</b><span class="effective">Advanced</span><span>Open Herdr pane</span></div></div></main></div></div>`}
function currentView(){return state.view==='issues'?issuesView():state.view==='agents'?agentsView():state.view==='allocation'?allocationView():settingsView()}
function render(){const shell=document.getElementById('shell'); shell.className=`shell opt${state.opt}`; if(state.opt===1){shell.innerHTML=`<aside class="sidebar">${repoSidebar()}</aside><main class="main">${currentView()}</main>`} else if(state.opt===2){shell.innerHTML=`${navRail()}<aside class="repo-sidebar">${repoSidebar(true)}</aside><main class="main">${currentView()}</main>`} else {shell.innerHTML=`<aside class="sidebar">${repoSidebar()}</aside><main class="main">${currentView()}</main>${contextRail()}`}
 document.querySelectorAll('.option-switch button').forEach(b=>b.classList.toggle('active',Number(b.dataset.opt)===state.opt)); document.querySelectorAll('.surface-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view)); bind();}
function bind(){document.querySelectorAll('[data-repo]').forEach(b=>b.onclick=()=>{state.repo=b.dataset.repo;render()}); document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.agent=null;render()}); document.querySelectorAll('[data-agent]').forEach(n=>n.onclick=()=>{state.agent=n.dataset.agent;render()}); document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();navigator.clipboard?.writeText(b.dataset.copy);showToast('Copied Auto Office launch command')}); document.querySelectorAll('[data-queue]').forEach(c=>c.onchange=()=>showToast(c.checked?'Issue authorized for Auto Queue':'Removed from Auto Queue')); document.querySelectorAll('[data-auth]').forEach(s=>s.onchange=()=>showToast(`Authorization set to ${s.value}`)); const sw=document.getElementById('autoswitch');if(sw)sw.onclick=()=>{state.auto=!state.auto;render();showToast(state.auto?'Auto allocation enabled':'Auto allocation disabled')}; document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>showToast('Prototype: current model invocation would stop and restart with the selected model + effort')); document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>showToast('Paused: moved to end of scheduler queue'));}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove('show'),2200)}
document.querySelectorAll('.option-switch button').forEach(b=>b.onclick=()=>{state.opt=Number(b.dataset.opt);render()});document.querySelectorAll('.surface-tabs button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
window.addEventListener('keydown',e=>{if(e.key==='1'||e.key==='2'||e.key==='3'){state.opt=Number(e.key);render()} if(e.key==='Escape'){state.agent=null;render()}})
render();
</script>
</body>
</html>
