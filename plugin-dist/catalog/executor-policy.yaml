benchmark_index: Artificial Analysis Engineering Index (2026-11)
floors: {XS: 31, S: 37, M: 40, L: 45, XL: 52}
# Owner-approved XS-XL advisory preference intent (not automatic model activation).
# A `rung` is an advisory preference priority (1 first); equal rungs are
# adaptive peers. Arrow fallbacks are soft, never eligibility guarantees.
# Rico's AA v5 table (2026-11-19). Hydrogen rungs stay conditional: they dispatch only through the
# Hydrogen gate (hydrogen_trials.py), never through ordinary scoring. A frontend-heavy task moves its
# size's agy gemini-* rung to rung 1 for that task only (executor_slates.frontend_bias); no route is added.
# Argon stays executor-eligible (role-policy.yaml, argon-medium-l floor exception) but is in no slate.
executor_preferred:
  XS:
    - {rung: 1, model_id: claude-haiku-5-5, effort: high, harness: claude}
    - {rung: 2, model_id: gpt-6.1-terra, effort: low, harness: codex}
    - {rung: 3, model_id: gemini-4-hydrogen, effort: low, harness: agy, conditional: true}
