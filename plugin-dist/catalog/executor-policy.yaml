# #871: Mutable executor/planner policy data. Runtime catalog route facts remain in TSV files.
schema_version: 1
policy_version: owner-xs-xl-seed-intent-2026-11-14-gated
benchmark_index: Artificial Analysis Intelligence Index v4.3.2
floors: {XS: 31, S: 38, M: 40, L: 44, XL: 47}
