# #871: Mutable executor/planner policy data. Runtime catalog route facts remain in TSV files.
schema_version: 1
policy_version: owner-xs-xl-scoreboard-2026-11-26-1356
benchmark_index: Artificial Analysis Engineering Index (2026-11)
floors: {XS: 31, S: 37, M: 40, L: 45, XL: 52}
# Owner-approved XS-XL advisory preference intent (not automatic model activation).
# A `rung` is an advisory preference priority (1 first); equal rungs are
# adaptive peers. Arrow fallbacks are soft, never eligibility guarantees.
# Rico's AA v5 table (2026-11-19). Hydrogen rungs stay conditional: they dispatch only through the
# Hydrogen gate (hydrogen_trials.py), never through ordinary scoring. A frontend-heavy task moves its
# size's agy gemini-* rung to rung 1 for that task only (executor_slates.frontend_bias); no route is added.
# Argon stays executor-eligible (role-policy.yaml, argon-medium-l floor exception) but is in no slate.
executor_preferred:
  XS:
    - {rung: 1, model_id: claude-haiku-5-5, effort: high, harness: claude}
    - {rung: 2, model_id: gpt-6.1-terra, effort: low, harness: codex}
    - {rung: 3, model_id: gemini-4-hydrogen, effort: low, harness: agy, conditional: true}
  S:
    - {rung: 1, model_id: claude-sonnet-5-5, effort: medium, harness: claude}
    - {rung: 2, model_id: gpt-6.1-terra, effort: medium, harness: codex}
    - {rung: 3, model_id: gemini-4-hydrogen, effort: medium, harness: agy, conditional: true}
  M:
    - {rung: 1, model_id: claude-sonnet-5-5, effort: high, harness: claude}
    - {rung: 2, model_id: gemini-4-hydrogen, effort: high, harness: agy, conditional: true}
    - {rung: 3, model_id: gpt-6.1-terra, effort: high, harness: codex}
  # Rico 2026-11-26 (executor scoreboard, #1356): "Just sonnet high first, then fallback to hermes sonnet if it's
  # available, then agy/codex". Sonnet 5.5 high: M 47% (23/49), L 34% (19/56) first-try accept. No Opus rung at L.
  L:
    - {rung: 1, model_id: claude-sonnet-5-5, effort: high, harness: claude}
    - {rung: 2, model_id: claude-sonnet-5-5, effort: high, harness: hermes}
    - {rung: 3, model_id: claude-sonnet-5-5, effort: high, harness: agy}
    - {rung: 4, model_id: gpt-6.1-terra, effort: high, harness: codex}
  XL:
    - {rung: 1, model_id: claude-opus-5-5, effort: high, harness: claude}
    - {rung: 2, model_id: gpt-6.2-sol, effort: high, harness: codex}
    - {rung: 3, model_id: gemini-4-neon, effort: high, harness: agy}
planner_preferred:
  M:
    - {model_id: claude-opus-5-5, effort: low, harness: claude}
    - {model_id: gpt-6-astra, effort: low, harness: codex}
    - {model_id: gemini-4-argon, effort: low, conditional: true}
  L:
    - {model_id: claude-opus-5-5, effort: medium, harness: claude}
    - {model_id: gpt-6-astra, effort: medium, harness: codex}
    - {model_id: gemini-4-argon, effort: medium}
  XL:
    - {model_id: claude-opus-5-5, effort: high, harness: claude}
    - {model_id: gpt-6-astra, effort: high, harness: codex}
    - {model_id: gemini-4-argon, effort: high}
model_restrictions:
  - {model_id: claude-opus-5-5, allowed_sizes: [XL], reason: "Opus 5.5 is reserved for XL subtasks (got {size})"}
  - {model_id: claude-sonnet-5-5, allowed_harnesses: [claude, agy, hermes], reason: "Sonnet 5.5 harness must be Claude Code, agy or Hermes"}
floor_exceptions:
  - name: argon-medium-l-intelligence-floor
    model_id: gemini-4-argon
    effort: medium
    size: L
    role: executor
    score_evidence: missing
    authorization: "score unpublished; no score fabricated"
    not_waived: [registration, conformance, trust, quota, risk]
