  # followed by terra medium & hydrogen medium as fallbacks. Let's set it, observe for at least 10 runs (both time &
  # accuracy), then if it works let it be canonical for auto-office." Sonnet medium stays allowed at S (pin it when
  # speed matters more than score). canary: makes a qualifying row lead routing at S (routing.py, executor_canary);
  # without it, adaptive scoring ranks the unscored Haiku xhigh below Terra medium. Restore slate (pre-canary, #1356), see docs/route-discovery.md "S canary (#1360)":
