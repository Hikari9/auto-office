schema_version: 3
config_precedence:
  - prompt_cli
  - repo
  - user
  - plugin_default
paths:
  repo: .auto-office/config.yaml
  user: ~/.config/auto-office/config.yaml
  local_data: ~/.local/share/auto-office
  runs_db: ~/.local/share/auto-office/runs.db
  catalog_dir: ~/.local/share/auto-office/catalog
worktree:
  # A repo-declared command Office runs once in each new worktree (#255), e.g.
  # "pnpm install --offline --frozen-lockfile || pnpm install --frozen-lockfile".
  # Office never picks a package manager; empty means it runs nothing.
  setup: ""
  # Repo-relative globs of the files setup depends on. A reused worktree re-runs setup when their
  # content (or the setup command) changes. Empty uses the known lockfiles (pnpm-lock.yaml,
  # Pipfile.lock, composer.lock, ...) at the root and one directory deep.
  setup_inputs: []
  setup_timeout_s: 600
  applies_to: [task, integration, check]
quota:
  # Ratified v3.1 charter (12A): protect 5% of provider quota.
  reserve_percent: 5
cost_policy:
  default: balanced
  # Legacy: planner and reviewer routing only. Executor and worker routing (#300)
  # never applies a money band; its cost safety valve is
  # routing.adaptive.budget_ceiling_usd.
  balanced_money_band_percent: 20
  available: [money_saver, quota_saver, balanced]
# Adaptive executor/worker routing (#300). Values are calibration defaults,
# replayable and inspectable (office inspect route / learner); omit a key to
# keep its default. Preference is weighted evidence, capped at 0.25.
routing:
  adaptive:
    competitive_band: 0.05
    budget_ceiling_usd: 25
    cost_scale_usd: 25
    spread_penalty: 0.03
    weights:
      balanced: {effectiveness: 0.40, cost: 0.25, speed: 0.15, quota: 0.10, preference: 0.10}
      money_saver: {effectiveness: 0.30, cost: 0.40, speed: 0.10, quota: 0.10, preference: 0.10}
      quota_saver: {effectiveness: 0.30, cost: 0.15, speed: 0.15, quota: 0.30, preference: 0.10}
    exploration:
      rate: 0.08
      margin: 0.10
      min_samples_mature: 6
      max_percent_rolling_20: 10
      max_per_run: 1
      max_cost_vs_primary_percent: 125
    learning:
      prior_strength: 8
      half_life_days: 120
      other_playbook_weight: 0.5
      size_mismatch_weight: 0.75
      fix_kind_weight: 0.75
      stale_harness_major_weight: 0.25
# Legacy 3.0 exploration policy (scripts/). Executor/worker exploration (#300)
# reads routing.adaptive.exploration.
exploration:
  max_per_run: 1
  max_percent_rolling_20: 10
  max_cost_vs_cheapest_percent: 125
  allowed_roles: [worker]
  allowed_playbooks: [Investigate, Prototype]
# Minimum model version per family for default routing. A catalog row below its
# family floor is skipped unless the route is named explicitly with --route.
model_family_floors:
  gemini: "3.7"
adapter_trust:
  proven_min_successful_dispatches: 5
  proven_min_task_shapes: 2
roles:
  orchestrator:
    router_selects: false
  planner:
    preferred_seed:
      - {model_id: opus, effort: medium}
      - {model_id: astra, effort: low}
    required_capabilities: [planning]
    floor:
      min_effort: low
      allowed_sources: ["local-evidence:", "documented:"]
  plan_reviewer:
    preferred_seed:
      - {model_id: luna, effort: high}
      - {model_id: sonnet, harness: claude, effort: high}
      - {model_id: opus, harness: claude, effort: low}
    required_capabilities: [review]
    floor:
      # Intelligence, not effort, is the floor (#183). Scores are version-pinned;
      # a candidate without a score for this exact index version fails closed.
      min_effort: none
      min_benchmark_index: {index_name: Artificial Analysis Intelligence Index v4.3.2, min_score: 31}
      allowed_sources: ["local-evidence:", "documented:"]
  executor:
    required_capabilities: [builder]
    floor:
      # Intelligence, not effort, is the floor (#183). Scores are version-pinned;
      # a candidate without a score for this exact index version fails closed.
      min_effort: none
      min_benchmark_index: {index_name: Artificial Analysis Intelligence Index v4.3.2, min_score: 31}
      allowed_sources: ["local-evidence:", "documented:"]
  worker:
    required_capabilities: []
    floor:
      min_effort: low
      allowed_sources: ["local-evidence:", "documented:"]
  code_reviewer:
    preferred_seed:
      - {model_id: luna, effort: high}
      - {model_id: sonnet, harness: claude, effort: high}
      - {model_id: opus, harness: claude, effort: low}
    required_capabilities: [review]
    floor:
      # Intelligence, not effort, is the floor (#183). Scores are version-pinned;
      # a candidate without a score for this exact index version fails closed.
      min_effort: none
      min_benchmark_index: {index_name: Artificial Analysis Intelligence Index v4.3.2, min_score: 31}
      allowed_sources: ["local-evidence:", "documented:"]
  browser_verifier:
    required_capabilities: [browser]
    floor:
      min_effort: low
      allowed_sources: ["local-evidence:"]
  # Visual judgment is a separate specialist from code review (charter 8B).
  # Preference order Gemini -> Sonnet -> Luna; a route qualifies only after an
  # image-sensitive conformance probe of its exact harness/model/effort path.
  # Reviewer independence is per agent, not per model family: a reviewer is
  # always a fresh dispatch, so it may share the producer's model.
  visual_reviewer:
    preferred_seed:
      # Latest Gemini Flash through agy (Gemini slugs embed effort); medium is the default.
      - {model_id: gemini-3.8-flash, harness: agy, effort: medium}
      - {model_id: sonnet, harness: claude, effort: high}
      - {model_id: luna}
    required_capabilities: [review, vision]
    floor:
      min_effort: low
      allowed_sources: ["local-evidence:", "documented:"]
  closeout_verifier:
    required_capabilities: [verification]
    floor:
      min_effort: medium
      allowed_sources: ["local-evidence:", "documented:"]
# Review contract (#337). Each run pins the contract it starts with
# (gates_json.review_contract); this key picks it for future runs only, so a
# rollback to v3.1 never reinterprets a run that already started.
#   convergence-v1: APPROVED | RECHECK | INTAKE_GAP; executors self-review and
#     run checks; one independent convergence review per ownership/composition
#     lane (plus one per shared composition boundary); 3 substantive rounds per
#     RECHECK sequence, then the operator decides.
#   v3.1: PASS | CHANGES_REQUIRED | PLAN_DEFECT | BRIEF_DEFECT | UNAVAILABLE,
#     rolling plan review and per-task independent review.
review:
  contract: convergence-v1
# Gear presets. Under convergence-v1, `independent_code_review` funds the lane
# convergence review (a hard landing gate) and `plan_review` funds plan review;
# the round ceiling is always 3 and the *_max_rounds keys below apply only to
# runs pinned to the v3.1 contract.
gear_presets:
  direct:
    dedicated_planner: false
    plan_review: risk_forced
    independent_code_review: risk_forced
    funded_browser_verification: acceptance_forced
    allow_advisory_undercut: true
    plan_review_max_rounds: null
    code_review_max_rounds: 3
  direct+review:
    dedicated_planner: false
    plan_review: false
    independent_code_review: true
    funded_browser_verification: acceptance_forced
    allow_advisory_undercut: true
    plan_review_max_rounds: null
    code_review_max_rounds: 3
  light:
    dedicated_planner: false
    plan_review: false
    independent_code_review: shallow
    funded_browser_verification: acceptance_forced
    allow_advisory_undercut: true
    plan_review_max_rounds: null
    code_review_max_rounds: 2
  quick:
    dedicated_planner: optional
    plan_review: false
    independent_code_review: cost_bounded
    funded_browser_verification: acceptance_forced
    allow_advisory_undercut: true
    plan_review_max_rounds: null
    code_review_max_rounds: 2
  express:
    dedicated_planner: optional
    plan_review: policy_optional
    independent_code_review: true
    funded_browser_verification: acceptance_forced
    allow_advisory_undercut: true
    plan_review_max_rounds: 2
    code_review_max_rounds: 2
  full:
    dedicated_planner: true
    plan_review: true
    independent_code_review: true
    funded_browser_verification: true
    allow_advisory_undercut: false
    plan_review_max_rounds: 5
    code_review_max_rounds: 5
# (v3.1 contract only) Round budget for a review that a gear's own preset doesn't fund (`plan_review: false`
# or `risk_forced` resolving False) but that fires anyway — an ad-hoc user-requested plan
# review, or a `risk_forced` gate that resolved True under a pinned low gear. Was
# previously bare prose in skills/auto-review/SKILL.md with no config backing; a caller
# had no field to read and no way to override it via repo/user config layering.
ad_hoc_review_max_rounds: 2
# v3.1 convergence bounds (docs/v31-rolling-review-gates.md Q8). Invalid captures
# and environment/adapter failures never spend implementation rounds; they have
# their own small bound. environment_retry_max is provisional until the
# matched-fixture evaluation measures it.
verification:
  environment_retry_max: 2
  recapture_max: 1
  visual_review_max_rounds: 2   # v3.1 contract only; convergence-v1 caps every RECHECK sequence at 3
  no_progress_repeats: 2
  job_timeout_seconds: 3600
  check_timeout_seconds: 1800
  # Host-wide cap on check suites running at once (task, run, and integration
  # checks across every run). 0 = max(1, CPUs // 4). Parallel full suites push
  # load past the CPU count and turn per-test timeouts into flakes.
  check_concurrency: 0
# Risk signals that escalate the default (unpinned) gear fit test past `direct`/`light`/
# `quick`/`direct+review` into `express`, and that resolve any `risk_forced` gate to True
# regardless of which gear ends up selected. `blast_radius` and `size_class` come from
# `start --blast-radius/--size-class`; omitted values are treated as unknown, not low —
# unknown never counts as risk on its own, only an explicit reversible/local/S-or-M
# classification does.
risk_signals:
  high_blast_radius: [production, production-data]
  high_size_class: [L, XL]

maturity:
  difficulty_weights: {S: 0.5, M: 1.0, L: 2.0, XL: 3.0}
  event_weights:
    verified_no_observed_failure: 1.0
    accepted_material_reviewer_catch: -0.75
    material_post_merge_defect: -2.0
    recurrence_failure: -3.0
    revert_failure: -4.0
  scrutiny_bar:
    min_labeled_runs: 30
    min_repositories_or_task_shapes: 3
  decay:
    minor_harness_release_no_contract_change: 0.9
    major_harness_or_invocation_change: 0.6
    new_model_generation: 0.5
    unrelated_change: 1.0
replay:
  min_labeled_rows_for_refit: 20
  train_fraction_oldest: 0.8
hard_invariants:
  - no_self_approval
  - fixed_lifecycle_order
  - packet_validation
  - policy_snapshot_pinning
  - human_merge_to_main
# Machine-level scheduler (`office queue`). Pressure thresholds gate admission
# only when measured; quota gates only when known.
scheduler:
  auto_mode: true
  aging_per_hour: 1.0          # score added per hour an item waits
  cpu_pressure: 0.9            # 1-minute load per core
  ram_pressure: 0.9            # fraction of physical memory in use
  max_active_runs: null        # null: no fixed cap
  orchestrator_route: claude   # harness that launches queued runs' orchestrators
intake:
  queue_issues: false
  authorization: preview       # what a queued intake is authorized to do
  ready_to_land: false
