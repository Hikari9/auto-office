<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auto Office — Web UI v2 prototype</title>
<style>
:root{
  --bg:#090b10; --panel:#10141b; --panel2:#151a23; --panel3:#1b2230; --line:#283142;
  --text:#eef2f8; --muted:#8994a7; --faint:#5e6878; --accent:#5b8cff; --accent2:#a98cff;
  --green:#4fd1a5; --yellow:#eab956; --red:#ef6a78; --blue:#6ea8ff; --purple:#b295ff; --cyan:#70d9b3;
  --radius:13px; --shadow:0 20px 60px rgba(0,0,0,.25);
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit} button{cursor:pointer}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{height:100vh;display:grid;grid-template-rows:48px 1fr}.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:#0c0f15;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:760;letter-spacing:-.01em;white-space:nowrap}.logo{width:23px;height:23px;border:1px solid #789dff;background:linear-gradient(145deg,#6ea8ff,#9a7cff);border-radius:7px;display:grid;place-items:center;color:#f5f8ff;font-weight:950;font-size:12px}.version{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.option-switch{display:flex;gap:4px;background:#080a0e;border:1px solid var(--line);padding:3px;border-radius:9px;margin-left:10px}.option-switch button,.surface-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 9px;border-radius:6px;font-size:12px}.option-switch button.active,.surface-tabs button.active{background:var(--panel3);color:white}.surface-tabs{display:flex;gap:2px;margin-left:auto}.top-status{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(79,209,159,.35)}
.shell{min-height:0;display:grid}.opt1{grid-template-columns:228px minmax(0,1fr)}.opt2{grid-template-columns:74px 230px minmax(0,1fr)}.opt3{grid-template-columns:198px minmax(0,1fr) 320px}
.sidebar,.repo-sidebar,.context-rail{min-height:0;background:#0d1016;border-right:1px solid var(--line);overflow:auto}.context-rail{border-right:0;border-left:1px solid var(--line);background:#0c1016}.main{min-width:0;min-height:0;overflow:auto;background:radial-gradient(circle at 70% 0%,rgba(91,140,255,.055),transparent 30%),var(--bg)}
.sidebar-inner{padding:12px}.section-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:800;margin:8px 7px}.repo-search{width:100%;background:#080a0e;border:1px solid var(--line);border-radius:8px;padding:8px 9px;outline:none;font-size:12px}.repo-search:focus{border-color:#56647a}.repo-list{display:grid;gap:4px;margin-top:9px}.repo{border:1px solid transparent;background:transparent;color:#b9c2cf;width:100%;display:flex;gap:8px;align-items:center;text-align:left;padding:8px 9px;border-radius:8px;font-size:12px}.repo:hover{background:#141923}.repo.active{background:#1b212b;border-color:#343d4c;color:white}.repo-icon{width:20px;height:20px;border-radius:6px;background:#202735;display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--accent2);flex:0 0 auto}.repo-meta{margin-left:auto;color:var(--faint);font-size:10px}.all-repos{border-color:#3b4555!important}
.navrail{padding:9px 8px;display:flex;flex-direction:column;gap:7px;align-items:center;background:#0a0d12;border-right:1px solid var(--line)}.navrail .navbtn{width:56px;border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 4px;border-radius:10px;font-size:9px;text-align:center}.navbtn .navico{display:block;font-size:16px;margin-bottom:4px}.navbtn.active{background:#1a202a;border-color:#343d4c;color:#fff}.navbtn:hover{background:#131821}
.page{padding:18px 20px 34px;min-width:900px}.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}.page-title{font-size:22px;font-weight:790;letter-spacing:-.025em}.page-sub{font-size:12px;color:var(--muted);margin-top:4px}.head-actions{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid var(--line);background:#151a22;color:#d8dee8;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:650}.btn:hover{border-color:#49566b;background:#1a202a}.btn.primary{background:#5b8cff;color:#08111f;border-color:#7ba4ff}.btn.ghost{background:transparent}.btn.danger{color:#ff8791;border-color:#5b3039}.btn.sm{padding:5px 8px;font-size:10px}.btn.active{border-color:#6757a6;background:#1c1931;color:#ddd3ff}
.metric-strip{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin-bottom:12px}.metric{border:1px solid var(--line);background:linear-gradient(180deg,#141922,#10141b);border-radius:10px;padding:10px 12px;min-width:0}.metric .v{font-size:18px;font-weight:800;letter-spacing:-.02em}.metric .k{font-size:10px;color:var(--muted);margin-top:2px}.metric .detail{font-size:9px;color:var(--faint);margin-top:4px}.accent-top{border-top:2px solid var(--accent)}
.filters{display:flex;gap:7px;align-items:center;margin:8px 0 10px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#11161e;color:#9ba6b7;border-radius:999px;padding:5px 9px;font-size:10px}.pill.active{border-color:#4d6ea8;color:#c7d8ff;background:#121c30}.search-main{min-width:260px;flex:1;max-width:440px;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;outline:none}
.table-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0e1218;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;font-size:11px}thead th{position:sticky;top:0;background:#141923;z-index:2;text-align:left;padding:9px 10px;color:#828da0;font-size:9px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}tbody td{padding:9px 10px;border-bottom:1px solid #1e2531;vertical-align:middle}tbody tr:hover{background:#141923}tbody tr.selected{background:#171e29;box-shadow:inset 2px 0 var(--accent)}.issue-title{font-weight:650;color:#e9edf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}.issue-title;font-weight:650;color:#e9edf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}.area
