function renderInbox(){
 const issues=inboxIssues.filter(i=>(state.filter==='All'||i.state===state.filter)&&(`${i.issue} ${i.repo} ${i.name}`).toLowerCase().includes(state.inboxQuery.toLowerCase()));
 $('workspace').innerHTML=`<section class="view-page"><div class="view-head"><div><h1>Issue Inbox</h1><p>Discover unstarted issues, inspect eligibility, or open their associated runs.</p></div><button class="button-primary" data-action="new-work">${icon('plus')} New work</button></div><div class="filter-row"><label class="filter-input">${icon('search','sm')}<input id="inboxSearch" placeholder="Search issue number, title, or repository" value="${html(state.inboxQuery)}"></label>${['All','Incoming','Running','Reviewing'].map(x=>`<button class="filter-btn ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="data-table"><div class="table-row head"><span>Issue</span><span>Readiness</span><span>Status</span><span></span></div>${issues.length?issues.map(i=>{const linked=runFixtures.find(r=>r.issue===i.issue&&r.repo===i.repo);const queued=state.queued.has(`${i.repo}/${i.issue}`);return `<div class="table-row"><div><div class="issue-title">#${i.issue} ${html(i.name)}</div><div class="issue-sub">${icon('folder','sm')} ${html(i.repo)} · Fictional issue fixture</div></div><div>${pill(i.priority==='Ready'?'completed':i.priority==='Needs mapping'?'blocked':'queued',i.priority)}</div><div>${pill(i.state==='Running'?'running':i.state==='Reviewing'?'reviewing':'queued',queued?'Queued':i.state)}</div><div class="action-cell">${linked?`<button class="button-secondary" data-run="${html(linked.id)}">Open run ${icon('chevron-right','sm')}</button>`:`<button class="button-secondary" data-action="queue" data-issue="${i.issue}" data-repo="${html(i.repo)}" ${i.priority==='Needs mapping'?'disabled title="Repository not execution-ready"':''}>${queued?'Queued ✓':'Queue (demo)'}</button>`}</div></div>`}).join(''):'<div class="table-empty">No issues match that filter.</div>'}</div><div class="info-card"><strong>Intake and readiness are separate.</strong><p class="file-caption">This standalone file cannot queue real GitHub issues. It demonstrates the UI states while Office remains the only execution authority.</p></div></section>`;
}
function renderAgentView(){
 const cols=[{title:'Orchestrators',group:['AO-7A42','AO-403E'],description:'User-facing messaging is permitted only to these verified sessions.'},{title:'Executors',group:['AO-7A42','WB-710A'],description:'Inspect work, route and liveness. No direct worker chat.'},{title:'Reviewers',group:['AO-403E','AO-7A42'],description:'Review findings and gates remain independent.'}];
 $('workspace').innerHTML=`<section class="view-page"><div class="view-head"><div><h1>Agents</h1><p>Inspect connected agent roles across Office runs. Messaging remains orchestrator-only.</p></div><button class="button-secondary" data-action="learn-roles">${icon('file')} Agent roles</button></div><div class="kpi-grid"><div class="kpi-small"><div class="number">3</div><div class="caption">Orchestrator sessions · sample</div></div><div class="kpi-small"><div class="number">4</div><div class="caption">Executor dispatches · sample</div></div><div class="kpi-small"><div class="number">2</div><div class="caption">Reviewers · sample</div></div></div><div class="agent-columns">${cols.map((c,index)=>`<div class="agent-col"><h3>${c.title}<span class="minor">${c.group.length}</span></h3>${c.group.map(id=>{const r=runFixtures.find(x=>x.id===id);return `<div class="agent-tile"><strong>${html(index===0?'Root orchestrator':index===1?'Executor':'Review agent')}</strong><div class="meta">${dot(r.status)}${html(r.repo)} · ${html(r.id)}</div><div class="meta">Harness/model: ${index===0?'GPT-6.1 Sol (demo)':'Not provided'}</div><button class="button-secondary" data-run="${html(r.id)}">Inspect parent run ${icon('chevron-right','sm')}</button></div>`}).join('')}<p style="margin:15px;color:var(--muted);font-size:10.5px">${html(c.description)}</p></div>`).join('')}</div></section>`;
}
function renderAllocation(){
 $('workspace').innerHTML=`<section class="view-page"><div class="view-head"><div><h1>Allocation</h1><p>The machine-wide Office queue — illustrated with local, fictional scheduling data.</p></div><button class="button-secondary" data-action="auto-mode">Auto mode <span class="switch ${state.autoMode?'on':''}" aria-hidden="true"></span></button></div><div class="kpi-grid"><div class="kpi-small"><div class="number">2</div><div class="caption">Running · demo</div></div><div class="kpi-small"><div class="number">${state.queue.filter(x=>x.status==='queued'&&!state.paused.has(x.id)).length}</div><div class="caption">Queued · demo</div></div><div class="kpi-small"><div class="number">—</div><div class="caption">Machine capacity · unavailable</div></div></div><div class="data-table" style="overflow:visible"><div class="card-header" style="padding:15px 17px;border-bottom:1px solid var(--line);margin:0"><h3>Active work &amp; queue</h3><span class="minor">Drag-free ordering · buttons simulate changes</span></div>${state.queue.map((q,i)=>`<div class="queue-row"><span class="queue-index">${String(i+1).padStart(2,'0')}</span>${dot(state.paused.has(q.id)?'paused':q.status)}<span class="queue-title"><strong>${html(q.title)}</strong><small>${html(q.meta)}</small></span>${pill(state.paused.has(q.id)?'paused':q.status)}<span class="pill ghost">${html(q.priority)}</span><div class="queue-actions"><button class="icon-btn" data-action="queue-up" data-qid="${q.id}" title="Move up in demo queue" aria-label="Move up">${icon('chevron-right')}</button><button class="icon-btn" data-action="queue-pause" data-qid="${q.id}" title="${state.paused.has(q.id)?'Resume':'Pause'} (demo)" aria-label="Pause or resume">${icon(state.paused.has(q.id)?'play':'pause')}</button></div></div>`).join('')}</div><div class="info-card"><strong>Safety and telemetry</strong><p class="file-caption">Queue and pause changes are local simulations only. Real admission, routes and receipts must be delegated to the Office runtime. Provider quotas and CPU/RAM are unavailable in this fixture.</p></div></section>`;
}
function renderSettings(){
 $('workspace').innerHTML=`<section class="view-page"><div class="view-head"><div><h1>Settings</h1><p>Appearance preferences for this prototype, separate from Office runtime policy.</p></div></div><section class="info-card" style="max-width:750px"><div class="card-header"><h3>Appearance</h3>${icon('settings')}</div><div class="settings-row"><div class="desc"><strong>Color theme</strong><p>Choose dark or light presentation.</p></div><select id="themeSelect"><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option></select></div><div class="settings-row"><div class="desc"><strong>Compact sidebar</strong><p>Collapse repository navigation into an icon rail.</p></div><button class="switch ${state.compact?'on':''}" data-action="compact-toggle" role="switch" aria-checked="${state.compact}" aria-label="Compact sidebar"></button></div><div class="settings-row"><div class="desc"><strong>Reduce motion</strong><p>Disable non-essential transitions and animations.</p></div><button class="switch ${state.reducedMotion?'on':''}" data-action="motion-toggle" role="switch" aria-checked="${state.reducedMotion}" aria-label="Reduce motion"></button></div></section><section class="info-card" style="max-width:750px"><div class="card-header"><h3>Office configuration · preview</h3><span class="pill ghost">Read only</span></div><div class="detail-grid"><dt>Machine</dt><dd>Office scheduling and global defaults</dd><dt>Repository</dt><dd>Overrides scoped to a checkout</dd><dt>Run</dt><dd>Frozen, pinned policy and launch contract</dd><dt>Network</dt><dd>Loopback-only (not connected in this HTML)</dd></div></section></section>`;
}
function update(){renderSidebar();renderTopAndMain()}
function switchRun(id){if(!runFixtures.find(r=>r.id===id))return;const oldFeed=$('feedScroll');if(oldFeed&&state.view==='run')state.savedScroll[state.runId]=oldFeed.scrollTop;state.runId=id;state.view='run';state.inspectorTab='overview';state.sidebarMobile=false;state.inspectorDrawer=false;update();try{history.replaceState(null,'',`#run=${encodeURIComponent(id)}`)}catch{}}
function switchView(view){if(!['run','inbox','agents','allocation','settings'].includes(view))return;const oldFeed=$('feedScroll');if(oldFeed&&state.view==='run')state.savedScroll[state.runId]=oldFeed.scrollTop;state.view=view;state.sidebarMobile=false;state.inspectorDrawer=false;update()}
function openModal(title,content){$('modalMount').innerHTML=`<div class="modal-backdrop" role="presentation" data-action="close-modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${html(title)}"><div class="modal-head"><h2>${html(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close modal">${icon('x')}</button></div><div class="modal-body">${content}</div><div class="modal-foot"><button class="button-secondary" data-action="close-modal">Close</button></div></section></div>`;$('modalMount').querySelector('[data-action=close-modal]').focus()}
function showPlan(){const r=run();openModal(`Plan for ${r.id}`,`<p>Run-first design for <strong>${html(r.title)}</strong>. This is a fictional plan for interaction testing.</p><div class="small-section-title">Task sequence</div>${r.tasks.length?r.tasks.map((t,i)=>`<div class="detail-task"><div class="top">${dot(t.status)}<span class="name">${html(t.id)} · ${html(t.name)}</span>${pill(t.status)}</div><p>${html(t.summary)}</p><p class="deps">Dependencies: ${html(t.deps.join(', ')||'none')}</p></div>`).join(''):'<p>No plan tasks are defined for this sample run.</p>'}<h3>Preserved product boundaries</h3><p>Office remains authoritative for run lifecycle, dispatch, reviews and landing. The browser does not provide a direct merge or shell API.</p>`)}
function showTask(id){const r=run();const t=r.tasks.find(x=>x.id===id);if(!t)return;openModal(`${t.id} · ${t.name}`,`<p>${html(t.summary)}</p><dl class="detail-grid"><dt>Run</dt><dd>${html(r.id)}</dd><dt>State</dt><dd>${pill(t.status)}</dd><dt>Agent role</dt><dd>${html(t.owner)}</dd><dt>Depends on</dt><dd>${html(t.deps.join(', ')||'none')}</dd><dt>Modified</dt><dd>${html(t.files.join(', ')||'No file list in fixture')}</dd></dl><h3>Observability</h3><p>Real model route, process liveness and event receipts would be retrieved from the local Office service. They are not simulated as actual telemetry.</p>`)}
function showReview(){openModal('Review findings · sample',`<p>This review panel is a UI demonstration, not an actual Code Reviewer verdict.</p><div class="detail-task"><div class="top">${icon('check-circle')}<span class="name">No blocking issues in the sample review</span></div><p>2 non-blocking suggestions are recorded in the fixture.</p></div><div class="detail-task"><div class="top">${icon('file')}<span class="name">Suggestion 1 · keyboard focus</span></div><p>Check modal focus return when closing the inspector.</p></div><div class="detail-task"><div class="top">${icon('file')}<span class="name">Suggestion 2 · stale status</span></div><p>Surface exact source freshness beside run status.</p></div>`)}
function showPr(){const r=run();openModal('PRs and changes · sample',`<p>Changes are sample records only. This HTML does not fetch or update GitHub pull requests.</p>${r.prs.length?r.prs.map(p=>`<div class="detail-task"><div class="top">${icon('git-pr')}<span class="name">#${p.id} ${html(p.title)}</span><span class="pill ghost">${html(p.state)}</span></div><p class="mono">${html(p.branch)}</p><p><span class="insertions">+${p.adds}</span> &nbsp; <span class="deletions">−${p.dels}</span> lines in this fixture</p></div>`).join(''):'<p>No linked PRs in this demo run.</p>'}<h3>Authority</h3><p>Merging and landing remain governed by Office and GitHub checks; there is no direct land/merge control here.</p>`)}
function showMore(){const r=run();openModal('Workbench actions',`<p><strong>Run:</strong> ${html(r.id)} · <strong>Issue:</strong> #${r.issue}</p><div style="display:flex;flex-wrap:wrap;gap:9px"><button class="button-secondary" data-action="copy-run">${icon('copy')} Copy run ID</button><button class="button-secondary" data-action="copy-command">${icon('terminal')} Copy demo command</button><a class="button-secondary" href="${githubIssue(r)}" target="_blank" rel="noopener">${icon('external')} Open issue on GitHub</a></div><h3>Prototype scope</h3><p>This file is standalone and offline. All run statuses, conversations, PRs, telemetry and queue actions are fictional UI fixtures.</p>`)}
function toggleInspector(){if(state.view!=='run'){switchView('run');return}if(matchMedia('(max-width:1170px)').matches){state.inspectorOpen=true;state.inspectorDrawer=!state.inspectorDrawer;}else{state.inspectorOpen=!state.inspectorOpen;state.inspectorDrawer=false;}renderTopAndMain()}
function closeOverlays(){if($('modalMount').innerHTML){$('modalMount').innerHTML='';return true}if($('paletteMount').innerHTML){$('paletteMount').innerHTML='';return true}if(state.sidebarMobile||state.inspectorDrawer){state.sidebarMobile=false;state.inspectorDrawer=false;update();return true}return false}
function copy(text){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>showToast('Copied to clipboard')).catch(()=>copyFallback(text));else copyFallback(text)}
function copyFallback(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-1000px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Copied to clipboard')}catch{showToast('Copy unavailable in this browser',false)}ta.remove()}
function sendMessage(){const r=run();const field=$('composerInput');if(!field)return;const value=field.value.trim();if(!value){field.focus();showToast('Write a message before previewing send',false);return}if(!['running','reviewing'].includes(r.status)){showToast('This run has no demo composer',false);return}state.localMessages[r.id]??=[];state.localMessages[r.id].push({text:value,when:'Just now · local'});state.drafts[r.id]='';renderRun();const feed=$('feedScroll');feed.scrollTop=feed.scrollHeight;showToast('Added to demo timeline — not delivered to Office');}
function palette(){const opts=[...runFixtures.map(r=>({label:`#${r.issue} ${r.title}`,caption:`${r.repo} · ${r.id}`,value:r.id,type:'run'})),...['inbox','agents','allocation','settings'].map(v=>({label:{inbox:'Issue Inbox',agents:'Agents',allocation:'Allocation',settings:'Settings'}[v],caption:'Workspace',value:v,type:'view'}))];
 const mount=$('paletteMount');mount.innerHTML=`<div class="palette" data-action="close-palette"><div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette"><label class="palette-search">${icon('search','lg')}<input id="paletteInput" placeholder="Jump to a run or workspace..." autocomplete="off"><span class="shortcut">ESC</span></label><div class="palette-items" id="paletteItems"></div></div></div>`;
 const render=()=>{const q=$('paletteInput').value.toLowerCase();$('paletteItems').innerHTML=opts.filter(o=>(o.label+' '+o.caption).toLowerCase().includes(q)).map(o=>`<button class="palette-item" data-palette-type="${o.type}" data-palette-value="${html(o.value)}">${icon(o.type==='run'?'folder':'command')}<span>${html(o.label)}</span><span class="caption">${html(o.caption)}</span></button>`).join('')||'<div class="no-results">No matching items</div>'};render();$('paletteInput').addEventListener('input',render);$('paletteInput').focus();}
function eventHandler(e){
 const nav=e.target.closest('[data-nav]');if(nav){switchView(nav.dataset.nav);return}
 const repo=e.target.closest('[data-repo-toggle]');if(repo){const key=repo.dataset.repoToggle;if(state.openRepos.has(key))state.openRepos.delete(key);else state.openRepos.add(key);renderSidebar();return}
 const runBtn=e.target.closest('[data-run]');if(runBtn){switchRun(runBtn.dataset.run);return}
 const tab=e.target.closest('[data-tab]');if(tab){state.inspectorTab=tab.dataset.tab;renderInspector();return}
 const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;renderInbox();return}
 const paletteItem=e.target.closest('[data-palette-type]');if(paletteItem){$('paletteMount').innerHTML='';if(paletteItem.dataset.paletteType==='run')switchRun(paletteItem.dataset.paletteValue);else switchView(paletteItem.dataset.paletteValue);return}
 const action=e.target.closest('[data-action]');if(!action)return;
 const a=action.dataset.action;
 if(a==='close-modal-backdrop'){if(e.target===action)$('modalMount').innerHTML='';return}
 if(a==='close-palette'){if(e.target===action)$('paletteMount').innerHTML='';return}
 if(a==='close-modal'){$('modalMount').innerHTML='';return}
 if(a==='mobile-sidebar'){state.sidebarMobile=!state.sidebarMobile;update();return}
 if(a==='inspector-toggle'){toggleInspector();return}
 if(a==='more'){showMore();return}
 if(a==='view-plan'){showPlan();return}
 if(a==='task-view'){showTask(action.dataset.task);return}
 if(a==='view-pr'){showPr();return}
 if(a==='view-review'){showReview();return}
 if(a==='send-message'){sendMessage();return}
 if(a==='attach'){showToast('Attachments are not connected in this static demo',false);return}
 if(a==='composer-plus'){openModal('Add context · prototype',`<p>In a connected implementation this menu would offer safe context attachments such as issue references, reviewed diffs and files subject to Office capabilities.</p><p>No local files are uploaded or sent by this prototype.</p>`);return}
 if(a==='copy-run'){copy(run().id);return}
 if(a==='copy-command'){copy(`office inspect --run ${run().id}`);return}
 if(a==='new-work'){openModal('New work · preview',`<p>Run-first work starts from a GitHub issue or approved intake request. New work appears in <strong>Issue Inbox</strong> until Office produces a run identity.</p><p>The prototype does not create real issues or runs.</p>`);return}
 if(a==='queue'){state.queued.add(`${action.dataset.repo}/${action.dataset.issue}`);renderInbox();showToast('Added to local demo queue — not Office');return}
 if(a==='learn-roles'){openModal('Agent roles',`<p><strong>Orchestrators</strong> manage the run, dispatch tasks, handle amendments and are the only agents that can be messaged through this UI.</p><p><strong>Executors</strong> work on scoped tasks. <strong>Reviewers</strong> independently check code and plan quality. Both are inspect-only in the prototype.</p>`);return}
 if(a==='auto-mode'){state.autoMode=!state.autoMode;renderAllocation();showToast(`Demo auto mode ${state.autoMode?'enabled':'disabled'} locally`);return}
 if(a==='queue-pause'){const id=action.dataset.qid;if(state.paused.has(id))state.paused.delete(id);else state.paused.add(id);renderAllocation();showToast('Updated demo pause state only');return}
 if(a==='queue-up'){const index=state.queue.findIndex(x=>x.id===action.dataset.qid);if(index>0){[state.queue[index-1],state.queue[index]]=[state.queue[index],state.queue[index-1]];renderAllocation();showToast('Moved earlier in demo queue')}else showToast('Already first in demo queue',false);return}
 if(a==='compact-toggle'){state.compact=!state.compact;update();return}
 if(a==='motion-toggle'){state.reducedMotion=!state.reducedMotion;document.body.classList.toggle('reduce-motion',state.reducedMotion);renderSettings();return}
}
document.addEventListener('click',eventHandler);
document.addEventListener('input',e=>{if(e.target.id==='sidebarSearch'){state.sidebarQuery=e.target.value;renderSidebar()}if(e.target.id==='inboxSearch'){state.inboxQuery=e.target.value;const pos=e.target.selectionStart;renderInbox();const inp=$('inboxSearch');inp.focus();inp.setSelectionRange(pos,pos)}if(e.target.id==='composerInput'){state.drafts[state.runId]=e.target.value;const el=e.target;el.style.height='35px';el.style.height=Math.min(105,el.scrollHeight)+'px'}});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect'){state.theme=e.target.value;document.documentElement.dataset.theme=state.theme;renderSettings();showToast('Updated local theme')}if(e.target.id==='modelSelect'){state.model=e.target.value;showToast('Composer model preview updated — no agent changed')}if(e.target.id==='effortSelect'){state.effort=e.target.value;showToast('Composer effort preview updated — no agent changed')}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeOverlays();return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();return}
 if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&document.activeElement?.id==='composerInput'){e.preventDefault();sendMessage();return}
 if(e.key==='Enter'&&document.activeElement?.id==='composerInput'&&!e.shiftKey){e.preventDefault();sendMessage()}
 if(e.key==='Enter'&&document.activeElement?.id==='paletteInput'){const first=$('paletteItems')?.querySelector('[data-palette-type]');if(first){e.preventDefault();first.click()}}
});
$('collapseSidebar').addEventListener('click',()=>{state.compact=!state.compact;update()});
$('addRepo').addEventListener('click',()=>openModal('Connect repository · prototype',`<p>The real app discovers GitHub repositories from authorized credentials and checks whether a repository is locally attached and execution-ready.</p><p>This offline preview includes five repository groups. It cannot connect new accounts.</p>`));
$('mobileOverlay').addEventListener('click',()=>{state.sidebarMobile=false;state.inspectorDrawer=false;update()});
const match=location.hash.match(/run=([^&]+)/);if(match){try{const v=decodeURIComponent(match[1]);if(runFixtures.some(r=>r.id===v))state.runId=v;}catch{}}
update();
})();
</script>
</body>
</html>
