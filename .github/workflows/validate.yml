name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # scripts/ is the retained 3.0 helper surface; its own tests run as that pinned helper.
      OFFICE_PINNED_LEGACY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test deps
        run: pip install -e '.[test]'
      - name: Ecosystem check
        run: python3 scripts/check_ecosystem.py
      - name: Unit tests (3.0 helpers + 3.1 runtime; visual tests skip without Playwright)
        run: python3 -m pytest tests/ -v
      - name: Adapter validation
        run: |
          for f in adapters/seed/*.yaml; do
            python3 scripts/office_runtime.py validate-adapter "$f"
          done
      - name: Schema validation
        run: python3 tests/test_schemas.py
      - name: Integration test
        run: python3 tests/test_integration.py -v
      - name: Build the distribution
        run: pip install build && python3 -m build --wheel && python3 -m zipfile -l dist/*.whl | grep -q office/_resources/config/config.default.yaml
