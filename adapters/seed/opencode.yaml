id: opencode
free_model_max_concurrent: 2
verified_state: valid-unverified
version_fingerprint:
  command: [opencode, --version]
  parser: first-line
model_source:
  type: cli
  command: [opencode, models]
# Checked before each headless launch; a failure stops the launch with the
# reason recorded (`preflight_failed`), never a silent wrong-model dispatch.
# model_check also requires the dispatch's pinned slug in the listed models.
preflight:
  model_check: [opencode, models]
# Office effort -> the opencode model variant suffix on --model
# (provider/model#variant, the documented per-run variant selector).
# Variants are model-specific: an unknown variant fails model resolution with
# `Variant unavailable` instead of running a silently wrong effort.
effort_mapping:
  low: low
  medium: medium
  high: high
  xhigh: xhigh
  max: max
benchmark_slug_mapping: {}
invocation:
  executable: opencode
  argv: [run, --model, "{model}#{effort}"]
  prompt_transport: argv
  cwd_transport: process-cwd
safe_prompt_passing:
  shell: false
  supports_prompt_file: false
  notes: >-
    Pass the prompt as one argv element after the run flags; never build a
    shell line. The model variant (Office effort) rides on --model as
    provider/model#variant, the documented per-run variant selector; an unknown
    variant fails model resolution instead of running a silently wrong effort.
dispatch_forms: [cli]
trusted_for: [discovery, read-only-investigation, prototype, reversible-sandbox-worker, conformance]
quota_probe:
  type: external-primitive
  command: null
  unknown_is_unlimited: false
shallow_review:
  supported: false
  minimum_effort: null
agentic_capability:
  default: unknown
failure_signatures:
  - {id: free-usage-limit-reached, attribution: harness, pattern: "Free usage limit reached"}
  - {id: rate-limit-exceeded, attribution: harness, pattern: "Rate limit exceeded"}
  - {id: unknown-variant-fails-resolution, attribution: adapter, pattern: "Variant unavailable for"}
  - {id: unknown-model-fails-resolution, attribution: harness, pattern: "Model unavailable:"}
  - {id: permission-prompt-blocks-headless, attribution: harness, pattern: "permission prompt with no --auto in a headless run blocks instead of auto-approving"}
conformance:
  deterministic: pending
  live: pending
source_notes: >-
  opencode v2.0.29 registered 2026-10-14; the flags below were re-verified
  against that version on 2026-10-14 via `opencode --help`,
  `opencode run --help`, `opencode mini --help`, `opencode models` and live
  `opencode run --model` probes. The headless form is
  `opencode run --model provider/model#variant "message"`: the message travels
  as one argv element (no shell), the #variant suffix is the documented
  per-run effort selector, and --auto (auto-approve permissions not explicitly
  denied) is deliberately omitted from every dispatched form so a permission
  prompt can never auto-approve in an Office worktree. `opencode models` lists
  provider/model slugs one per line; preflight requires the pinned slug there
  before every launch. Probed 2026-10-14 on
  opencode/muse-spark-1.3-contributor-free: low/medium/high/xhigh launch
  (READY), while #none and #max fail fast with `Variant unavailable` (none is
  left unmapped so route amendments reject it; max stays mapped), a bogus
  variant fails fast the same way, and an unknown model fails fast with `Model
  unavailable`. Preflight requires the pinned slug in `opencode models`;
  `auth list` exit status is not sign-in evidence or a launch gate; onboarding
  reads its output to recognize authentication. It reports a listed `-free`
  model as the named credential-free usable path, while
  signed-in OpenCode is usable through its authenticated path. A reviewer
  profile is declared (no vision profile). opencode has no permission flag, but
  agent permissions fence a reviewer to reading plus one reply file: Office
  writes that agent per dispatch (see the reviewer profile), and the result is
  read only from the reply file. Its quota is always unknown (no probe; never
  treated as unlimited). Session identity is not declared; opencode keeps its own
  sessions (opencode.db, --session exists) which Office does not read, so no
  headless resume form exists yet. A pane-hosted interactive form is declared
  for Herdr delegation (herdr_kind opencode, `mini --model` with the same trust
  posture and pinned model/effort; mini is the interactive surface that accepts
  --model, verified to require a TTY rather than reject the flag; it also takes
  --standalone and --agent, which the reviewer pane uses so the per-dispatch
  agent in OPENCODE_CONFIG_DIR applies, since a background service would not
  see that environment). Under Herdr both workers and reviewers get panes (the
  same label, pane identity check on cwd, agent kind, agent name and session, and
  brief-pointer delivery as other pane agents); the pane form is `max_minutes`
  capped by the pane watcher (`wall_cap`), as `mini` has no timeout of its own, and
  a quota or rate-limit wall printed in the pane (`Free usage limit reached`,
  `Rate limit exceeded`) is classified by the same quota check on the pane tail
  as for any pane agent, since the failure signatures above are its text. Session
  and transcript: opencode 2.0.29 keeps sessions in opencode.db (session_v2 holds
  id and directory; session_message holds `user` messages with a JSON `text` field
  and `assistant` messages whose `content` mixes reasoning, tool and text parts).
  Office reads only the `user` message, read-only, for the landing probe
  (`prompt_seen`) and the session id; `mini --session <id>` is the pane resume form
  (flag per `opencode mini --help`, not yet exercised live). No `final_reply`
  reader exists on purpose: a review is read only from the reply file the
  reviewer's agent may edit, never from pane or session text. Conformance
  stays pending and variant names stay model-specific: an unknown variant fails
  fast at launch, never silently.
# opencode takes no id at launch and keeps its sessions in its own SQLite store
# (opencode.db), which Office reads read-only: the session whose `user` message
# carries this dispatch's brief path (`transcript`), or the id herdr reports
# (`herdr`). It never reads an assistant reply from it (see source_notes).
session:
  id: detected
  sources: [herdr, transcript]
capabilities: [builder]
office_profiles:
  worker:
    argv: [run, --model, "{model}#{effort}"]
    prompt: argv
    output: stdout
    herdr_kind: opencode
    # Pane-hosted interactive form (visible delegation under Herdr): the same
    # trust posture (no --auto), the model and effort still pinned. `mini` is
    # the interactive surface that accepts --model; the headless `run` form
    # above stays the dispatch-of-record for smoke and conformance.
    interactive:
      argv: [mini, --model, "{model}#{effort}"]
      resume_argv: [--session, "{session_id}"]
      wall_cap: true
    # opencode run has no timeout of its own, so the supervisor's wall cap
    # stops a stuck dispatch instead of holding the task open forever. The pane
    # form (`mini`) has none either: wall_cap makes the pane watcher apply the
    # same max_minutes (or OFFICE_WORKER_MAX_MINUTES) and close the pane.
    max_minutes: 60
  # Pane-hosted reviewer. opencode has no permission flag, so Office writes the
  # per-dispatch `office-reviewer` agent into <dispatch dir>/opencode/agents/
  # (agent_file) and sets OPENCODE_CONFIG_DIR to it for both the pane and the
  # headless launch. The generated permissions, verified against opencode 2.0.29:
  #   deny `*`; allow read/glob/grep `*`; deny read `*.env`, `*.env.*`;
  #   external_directory `<dir>/*` for the checkout (cwd), include_dirs, shared
  #   read roots and the dispatch dir (each also as its realpath);
  #   edit on the exact reply file only (absolute, realpath, cwd-relative).
  # No --auto anywhere: a permission nobody granted is denied, never approved.
  reviewer:
    argv: [run, --standalone, --agent, office-reviewer, --model, "{model}#{effort}"]
    prompt: argv
    output: stdout
    herdr_kind: opencode
    agent_file: {format: opencode, name: office-reviewer, env: OPENCODE_CONFIG_DIR}
    interactive:
      argv: [mini, --standalone, --agent, office-reviewer, --model, "{model}#{effort}"]
      resume_argv: [--session, "{session_id}"]
      wall_cap: true
      # `mini` can leave a registered Herdr agent after its pane process exits.
      # With no reply file, `done` is terminal and must permit route fallback.
      terminal_statuses_without_reply: [done]
    max_minutes: 60
