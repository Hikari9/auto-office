[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "auto-office"
version = "3.5.0"
description = "Auto Office: adaptive, independently reviewed agent engineering runtime behind one `office` CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Auto Office maintainers" }]
dependencies = [
  "PyYAML>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
# Deterministic browser capture for visual gates. Without it the visual gate
# reports CAPTURE_BLOCKED instead of passing.
visual = ["playwright>=1.40"]
test = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6.100"]
# Mutation testing is a periodic audit of the core-logic tests, not part of the gate: see docs/mutation-testing.md.
mutation = ["mutmut>=3.2,<4"]

[project.scripts]
office = "office.cli:main"

[project.urls]
Repository = "https://github.com/Hikari9/auto-office"

[tool.hatch.build.targets.wheel]
packages = ["src/office"]

# Runtime resources live at the repository root so the legacy v3 helpers and the
# packaged runtime read the same files. A wheel carries them under office/_resources.
[tool.hatch.build.targets.wheel.force-include]
"config" = "office/_resources/config"
"schemas" = "office/_resources/schemas"
"catalog" = "office/_resources/catalog"
"adapters" = "office/_resources/adapters"
"skills" = "office/_resources/skills"
"SKILL.md" = "office/_resources/SKILL.md"
"VERSION" = "office/_resources/VERSION"
# The hub (SKILL.md) links to these for operating detail, so a wheel-only install needs them.
"docs/orchestrator-reference.md" = "office/_resources/docs/orchestrator-reference.md"
"docs/review-convergence.md" = "office/_resources/docs/review-convergence.md"
"docs/onboarding.md" = "office/_resources/docs/onboarding.md"
"scripts/codex-usage.py" = "office/_resources/scripts/codex-usage.py"
"scripts/claude-usage.py" = "office/_resources/scripts/claude-usage.py"
"scripts/agy-usage.py" = "office/_resources/scripts/agy-usage.py"

[tool.hatch.build.targets.sdist]
include = ["src", "config", "schemas", "catalog", "adapters", "skills", "scripts", "docs", "SKILL.md", "VERSION", "README.md", "MANIFESTO.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "scripts"]
markers = [
    "approved: the test starts from a run whose default plan is approved (restored from a per-module snapshot)",
    "review_contract(name): runs the test's Office runs under that review contract (v3.1 suites keep testing pinned pre-#337 runs)",
    "slow: minutes-long real-gate tests (dogfood); deselected by default, run with --all or -m slow",
    "integration: needs a repo, subprocess, fake harness or browser; deselected by default, run with --all or -m integration",
    "legacy: tests the 3.0 scripts/ surface; deselected by default, run with --all or -m legacy",
]

# Mutation testing (mutmut 3) audits whether the core-logic tests notice a changed behaviour. It is scoped to
# deterministic policy modules and run by hand (docs/mutation-testing.md), never by the validate gate.
[tool.mutmut]
source_paths = [
    "src/office/scoring.py",
    "src/office/routing.py",
    "src/office/scheduler.py",
    "src/office/guide.py",
    "src/office/briefs.py",
    "src/office/preflight.py",
    "src/office/config.py",
    "src/office/web/service.py",
]
also_copy = ["src", "tests", "config", "schemas", "catalog", "adapters", "skills", "docs", "scripts", "SKILL.md", "VERSION", "plugin.json",
             "README.md", "MANIFESTO.md", "CONTEXT.md", "CLAUDE.md", "references", "protocol", "patterns", "agents", "evals", "eval", "proposal-templates"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
# Default selection: the scoring properties, which run in seconds. Narrow it to a module's own tests for each run (the table in
# docs/mutation-testing.md): the whole list at once never finished its stats pass under mutmut.
pytest_add_cli_args_test_selection = ["tests/v31/test_scoring_properties.py"]
max_children = 2
