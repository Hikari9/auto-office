notes: >-
  Shipped adapter trust. Each route is `harness@major/model_id@effort`; trust keys on the
  harness major, so point releases inherit it. A route here reads as `proven` on a fresh
  install. Any local act in runs.db for the same route wins over this file, and a standing
  adapter-attributed failure quarantines the route regardless. Add a route only with a
  maintainer grant on record; run history alone does not qualify (outcome labels were not
  recorded before 3.1, so no route had labelled evidence at the 5-success threshold).
  Prior trust grants for retired models are preserved only in the historical
  archive so reintroducing a retired row cannot reactivate prior trust.
