    # routed identity. So the identity IS pinnable, just not at launch: it must be
    # set in-session and then READ BACK off the pane footer before dispatch.
    # These rows stay `dispatchable: false` because `office_spawn.sh` cannot
    # perform that post-launch step; a caller that does it manually and verifies
