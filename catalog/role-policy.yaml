# Shipped role routing policy (#850 sections 1-3): the one source of truth for the allow / deny rules a fresh
# install carries. Everything not listed is neutral, never implicitly denied, and stays eligible.
#
#   role:
#     <harness>[@<major>][|<harness>[@<major>]...]/<model>:
#       allow | deny:
#         <effort | "*">: all | [XS, S, M, L, XL]      # "all" = every size; "*" = every effort
#
# Preference ORDER is not here: executors use executor_slates.IDEAL, reviewers and the visual reviewer use
# roles.<role>.preferred_seed in config.default.yaml. A user's routing.user_policy.role_rules outrank every rule
# below, and a size-scoped rule only applies when the task size is known.
version: 1

executor:
  # Rico 2026-11-19 (AA v5 table): Haiku 5.5 high is the XS executor only. It has no allowance above XS.
  # Scoreboard 2026-11-26 (#1356): Haiku high M 28% first-try accept. Denied at M and L.
  # S canary (#1360, Rico 2026-11-26): Haiku xhigh is the S executor on Claude Code and Hermes, at S only.
  # Pre-canary rule: allow {medium: [XS], high: [XS]}; deny {medium: [M, L], high: [M, L], xhigh: all, max: all}.
  claude@2/claude-haiku-5-5:
    allow: {medium: [XS], high: [XS], xhigh: [S]}
    deny: {medium: [M, L], high: [M, L], xhigh: [XS, M, L, XL], max: all}
  hermes/claude-haiku-5-5:
    allow: {xhigh: [S]}
    deny: {xhigh: [XS, M, L, XL], max: all}
  # Rico 2026-11-19: Gemini 3.8 Flash is retired in every role (superseded by Gemini 4 Hydrogen).
  agy@1/gemini-3.8-flash: &retired
    deny: {"*": all}
  # Scoreboard 2026-11-26 (#1356): Terra medium M 12% (2/17, 17 operational reroutes). A small-task model.
  codex@0/gpt-6.1-terra:
    allow: {low: [XS], medium: [S], high: [M, L]}
    deny: {medium: [M, L], high: [XS, S], xhigh: all, max: all}
  # Scoreboard 2026-11-26 (#1356): Sonnet medium M 26% (37/142) vs high 47% (23/49). High is the M/L executor.
  claude@2/claude-sonnet-5-5:
    allow: {medium: [S], high: [M, L]}
    deny: {medium: [M, L], high: [XS, S], xhigh: all, max: all}
  agy@1/claude-sonnet-5-5:
    allow: {medium: [S], high: [M, L]}
    deny: {medium: [M, L], high: [XS, S], xhigh: all, max: all}
  hermes/claude-sonnet-5-5:
    allow: {medium: [S], high: [M, L]}
    deny: {medium: [M, L], high: [XS, S], xhigh: all, max: all}
  # Scoreboard 2026-11-26 (#1356): GLM free M 22/24 operational reroutes. Only a free XS try.
  opencode/glm-5.3-flash:
    allow: {max: [XS]}
    deny: {max: [M, L]}
  # Scoreboard 2026-11-26 (#1356): Luna high executor M 0/4. It is the code reviewer, not an M/L executor.
  codex@0/gpt-6-luna:
    deny: {"*": [M, L]}
  # Claude Code only. An Opus executor on agy is never automatic, so its XL medium is denied too.
  # Rico 2026-11-26 (#1356): no Opus at L ("remove Opus from the fallback"). XL is unchanged.
  claude@2/claude-opus-5-5:
    allow: {high: [XL]}
    deny: {medium: [XS, S, M, L], high: [XS, S, M, L], xhigh: all, max: all}
  agy@1/claude-opus-5-5:
    deny: {medium: all, high: all, xhigh: all, max: all}
  codex@0/gpt-6.1-sol:
    allow: {medium: [XL]}
    deny: {high: all, xhigh: all, max: all}
  codex@0/gpt-6.2-sol:
    allow: {medium: [L], high: [XL]}
    deny: {low: all, xhigh: all, max: all}
  agy@1/gemini-4-neon:
    allow: {medium: [L], high: [XL]}
    deny: {low: all, xhigh: all, max: all}
  # TODO(Gemini 4 Argon registration PR): confirm the registered harness and model id; inert until then.
  agy@1/gemini-4-argon:
    allow: {medium: [L], high: [XL]}
    deny: {high: [XS, S, M, L], xhigh: all, max: all}
  # Retired generations and Astra are never executors. Astra planning is a separate role and unaffected.
  codex@0/gpt-6-astra:
    deny: {"*": all}
  codex@0/gpt-5.6-sol:
    deny: {"*": all}
  codex@0/gpt-5.6-terra:
    deny: {"*": all}

# Code review and plan review have separate rule blocks. Order is roles.<role>.preferred_seed. Opus never reviews
# above low, and Sonnet 5.5 medium/high never reviews. Code review is Luna high then Opus low (Rico 2026-11-19);
# Hydrogen is not a code reviewer. Plan review also admits DeepSeek max and Opus low on agy.
code_reviewer:
  codex@0/gpt-6-luna:
    allow: {high: all}
    deny: {xhigh: all, max: all}
  claude@2|agy@1/claude-opus-5-5:
    allow: {low: all}
    deny: {medium: all, high: all, xhigh: all, max: all}
  claude@2|agy@1/claude-sonnet-5-5:
    deny: {medium: all, high: all}
  agy@1/gemini-3.8-flash: *retired
plan_reviewer:
  codex@0/gpt-6-luna:
    allow: {high: all}
    deny: {xhigh: all, max: all}
  opencode/deepseek-v4.1-flash-free:
    allow: {max: all}
  claude@2|agy@1/claude-opus-5-5:
    allow: {low: all}
    deny: {medium: all, high: all, xhigh: all, max: all}
  claude@2|agy@1/claude-sonnet-5-5:
    deny: {medium: all, high: all}
  agy@1/gemini-3.8-flash: *retired

visual_reviewer:
  agy@1/gemini-3.8-flash: *retired
  codex@0/gpt-6.1-terra:
    allow: {low: all}
  codex@0/gpt-5.6-terra:
    deny: {low: all}

worker:
  agy@1/gemini-3.8-flash: *retired

planner:
  agy@1/gemini-3.8-flash: *retired

integration_reviewer:
  agy@1/gemini-3.8-flash: *retired

browser_verifier:
  agy@1/gemini-3.8-flash: *retired

closeout_verifier:
  agy@1/gemini-3.8-flash: *retired
