# Orchestrator dispositions: case -> reviewer -> finding index -> accept|reject.
# accept = a real defect in the change (planted or not); reject = not a real defect.
p1-logic:
  luna: {0: accept}
  hydrogen: {0: accept}
p2-auth:
  luna: {0: accept}
  hydrogen: {0: accept}  # also names the existing exact-allow test the change breaks: true
p3-off-by-one:
  luna: {0: accept}
  hydrogen: {0: accept}
p4-missing-test:
  # Unplanted but real: timedelta(seconds=1e308) raises OverflowError, so kick() crashes.
  luna: {0: accept}
  hydrogen: {0: accept, 1: accept}
p5-race:
  # Unplanted but real: tests/v31/test_issue_1143_hydrogen_trials.py expects book() to raise outside a tx.
  luna: {0: accept, 1: accept}
  hydrogen: {0: accept, 1: accept}
